<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>区域选择</title>
    <style>
      :root {
        --ink: #111214;
        --muted: #6f7076;
        --line: #e4e4e7;
        --land: #ebebec;
        --land-hover: #d6d6d9;
        --paper: #fafafa;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        padding: clamp(10px, 1.6vw, 22px);
        background: var(--paper);
        color: var(--ink);
        font-family: system-ui, -apple-system, "SF Pro Text", "Segoe UI",
          "PingFang SC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .shell {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 1600px;
        height: calc(100vh - 2 * clamp(10px, 1.6vw, 22px));
        min-height: 640px;
        margin: 0 auto;
        padding: clamp(14px, 1.6vw, 24px);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: 0 1px 2px rgba(17, 18, 20, 0.04);
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 4px 4px 12px;
      }

      .logo {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: var(--ink);
        flex: none;
      }

      .back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        text-decoration: none;
        cursor: pointer;
      }

      .back:hover {
        background: #f4f4f5;
      }

      .top-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .who {
        font-size: 13.5px;
        color: var(--muted);
        white-space: nowrap;
      }

      .logout {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }

      .logout:hover {
        background: #f4f4f5;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .map {
        position: relative;
        flex: 1 1 0;
        min-height: 0;
        overflow: hidden;
      }

      .map svg {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      .map-status[hidden] {
        display: none;
      }

      .country {
        fill: var(--land);
        stroke: #fff;
        stroke-width: 0.8;
        vector-effect: non-scaling-stroke;
        cursor: pointer;
        transition: fill 0.16s ease;
      }

      .country:hover {
        fill: var(--land-hover);
      }

      .country.is-selected {
        fill: var(--ink);
      }

      .country.is-selected:hover {
        fill: #33343a;
      }

      .map::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
            90deg,
            #fff 0%,
            rgba(255, 255, 255, 0) 14%
          ),
          linear-gradient(270deg, #fff 0%, rgba(255, 255, 255, 0) 10%),
          linear-gradient(0deg, #fff 0%, rgba(255, 255, 255, 0) 20%),
          linear-gradient(180deg, #fff 0%, rgba(255, 255, 255, 0) 8%);
      }

      .map-status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 14px;
        color: var(--muted);
        pointer-events: none;
      }

      .tooltip {
        position: absolute;
        z-index: 3;
        transform: translate(-50%, -130%);
        padding: 6px 9px;
        border-radius: 7px;
        background: var(--ink);
        color: #fff;
        font-size: 12px;
        white-space: nowrap;
        pointer-events: none;
      }

      .prompt {
        padding: clamp(8px, 1.4vw, 16px) 16px 4px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 3vw, 34px);
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .sub {
        margin: 8px 0 0;
        font-size: clamp(14px, 1.5vw, 17px);
        color: var(--muted);
      }

      .levels {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: clamp(16px, 2.2vw, 26px);
      }

      .level {
        padding: 11px 18px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 15px;
        cursor: pointer;
        transition: background-color 0.15s ease, border-color 0.15s ease;
      }

      .level:hover {
        border-color: #c9c9ce;
      }

      .level[aria-pressed="true"] {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }

      .selection {
        min-height: 22px;
        margin: 10px 0 0;
        font-size: 14px;
        color: var(--muted);
      }

      .selection b {
        color: var(--ink);
        font-weight: 600;
      }

      .clear {
        margin-left: 8px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 14px;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }

      .continue {
        margin-top: 6px;
        padding: 13px 26px;
        border: 0;
        border-radius: 12px;
        background: var(--ink);
        color: #fff;
        font: inherit;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: transform 0.15s ease, background-color 0.15s ease;
      }

      .continue:hover {
        background: #2a2b30;
      }

      .continue:active {
        transform: scale(0.98);
      }

      .continue.saved {
        background: #1c7c54;
      }

      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        justify-content: space-between;
        align-items: center;
        padding: 18px 4px 2px;
        font-size: 13.5px;
        color: var(--muted);
      }

      footer nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 12px;
        align-items: center;
      }

      footer a {
        color: var(--muted);
        text-decoration: none;
      }

      footer a:hover {
        color: var(--ink);
      }

      footer .sep {
        color: #d4d4d8;
      }

      @media (max-width: 720px) {
        .who {
          display: none;
        }

        .map {
          min-height: 180px;
        }

        .shell {
          height: auto;
          border-radius: 16px;
        }

        .map svg {
          position: static;
          height: 42vh;
        }

        .level {
          padding: 10px 14px;
          font-size: 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="#fff">
            <rect x="2" y="3" width="12" height="4" rx="1" />
            <rect x="2" y="9" width="8" height="4" rx="1" />
          </svg>
        </span>
        <a class="back" href="/">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
          Back
        </a>
        <div class="top-right">
          <span class="who">Logged in as contact@raise-exception.com</span>
          <button class="logout" type="button">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" />
              <path d="M10 8l-4 4 4 4M6 12h10" />
            </svg>
            Log out
          </button>
        </div>
      </header>

      <main>
        <div class="map" id="map">
          <svg id="map-svg" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid slice" role="img" aria-label="World map of selectable markets"></svg>
          <div class="map-status" id="map-status">Loading map…</div>
          <div class="tooltip" id="tooltip" hidden></div>
        </div>

        <section class="prompt">
          <h1>Where do you sell?</h1>
          <p class="sub">Choose the markets that matter most to your client.</p>

          <div class="levels" role="group" aria-label="Selection granularity">
            <button class="level" type="button" data-level="global" aria-pressed="false">Global</button>
            <button class="level" type="button" data-level="continent" aria-pressed="false">Continent</button>
            <button class="level" type="button" data-level="country" aria-pressed="true">Country</button>
          </div>

          <p class="selection" id="selection" aria-live="polite"></p>

          <button class="continue" id="continue" type="button">Continue</button>
        </section>
      </main>

      <footer>
        <span>©2026 RAISE EXCEPTION</span>
        <nav>
          <a href="#">Terms of service</a>
          <span class="sep">|</span>
          <a href="#">DPA</a>
          <span class="sep">|</span>
          <a href="#">Privacy policy</a>
        </nav>
      </footer>
    </div>

    <script>
      const state = {
        level: 'country',
        countries: new Set(),
        continents: new Set(),
      };

      const map = document.getElementById('map');
      const svg = document.getElementById('map-svg');
      const tooltip = document.getElementById('tooltip');
      const statusEl = document.getElementById('map-status');
      const selectionEl = document.getElementById('selection');
      const continueBtn = document.getElementById('continue');
      const shapes = [];

      const SVG_NS = 'http://www.w3.org/2000/svg';

      function toggle(set, value) {
        if (set.has(value)) set.delete(value);
        else set.add(value);
      }

      function isSelected(shape) {
        if (state.level === 'global') return true;
        if (state.level === 'continent') {
          return state.continents.has(shape.dataset.continent);
        }
        return state.countries.has(shape.dataset.name);
      }

      function render() {
        shapes.forEach((shape) => {
          shape.classList.toggle('is-selected', isSelected(shape));
        });
        renderSelection();
      }

      function selectedCount() {
        if (state.level === 'global') return 1;
        if (state.level === 'continent') return state.continents.size;
        return state.countries.size;
      }

      function renderSelection() {
        const count = selectedCount();

        if (count === 0) {
          selectionEl.textContent = '';
          return;
        }

        selectionEl.innerHTML = '';

        if (state.level !== 'global') {
          const b = document.createElement('b');
          b.textContent = String(count);
          selectionEl.append(b, ' ');
        }

        if (state.level === 'global') {
          selectionEl.append('Global market selected');
        } else if (state.level === 'continent') {
          selectionEl.append(
            (count === 1 ? 'continent' : 'continents') + ' selected',
          );
        } else {
          selectionEl.append(
            (count === 1 ? 'country' : 'countries') + ' selected',
          );
        }

        if (state.level !== 'global') {
          const clear = document.createElement('button');
          clear.className = 'clear';
          clear.type = 'button';
          clear.textContent = 'Clear';
          clear.addEventListener('click', clearSelection);
          selectionEl.append(clear);
        }
      }

      function clearSelection() {
        state.countries.clear();
        state.continents.clear();
        render();
      }

      function setLevel(level) {
        state.level = level;
        state.countries.clear();
        state.continents.clear();
        document.querySelectorAll('.level').forEach((btn) => {
          btn.setAttribute('aria-pressed', String(btn.dataset.level === level));
        });
        render();
      }

      function showTip(shape, event) {
        const rect = map.getBoundingClientRect();
        tooltip.textContent = shape.dataset.name;
        tooltip.style.left = event.clientX - rect.left + 'px';
        tooltip.style.top = event.clientY - rect.top - 4 + 'px';
        tooltip.hidden = false;
      }

      function buildMap(countries) {
        const g = document.createElementNS(SVG_NS, 'g');

        countries.forEach((country) => {
          const path = document.createElementNS(SVG_NS, 'path');
          path.setAttribute('d', country.d);
          path.setAttribute('class', 'country');
          path.dataset.name = country.name;
          path.dataset.continent = country.continent;
          path.setAttribute('aria-label', country.name);
          g.appendChild(path);
          shapes.push(path);
        });

        svg.appendChild(g);
        statusEl.hidden = true;

        g.addEventListener('pointerover', (event) => {
          const shape = event.target.closest('.country');
          if (shape) showTip(shape, event);
        });

        g.addEventListener('pointermove', (event) => {
          if (tooltip.hidden) return;
          const shape = event.target.closest('.country');
          if (shape) showTip(shape, event);
        });

        g.addEventListener('pointerout', (event) => {
          if (!event.relatedTarget || !event.relatedTarget.closest?.('.country')) {
            tooltip.hidden = true;
          }
        });

        g.addEventListener('click', (event) => {
          const shape = event.target.closest('.country');
          if (!shape) return;

          if (state.level === 'global') return;
          if (state.level === 'continent') {
            toggle(state.continents, shape.dataset.continent);
          } else {
            toggle(state.countries, shape.dataset.name);
          }
          render();
        });

        render();
      }

      document.querySelectorAll('.level').forEach((btn) => {
        btn.addEventListener('click', () => setLevel(btn.dataset.level));
      });

      continueBtn.addEventListener('click', () => {
        if (selectedCount() === 0) {
          selectionEl.textContent = 'Pick at least one market first.';
          return;
        }
        continueBtn.classList.add('saved');
        continueBtn.textContent = 'Saved ✓';
        setTimeout(() => {
          continueBtn.classList.remove('saved');
          continueBtn.textContent = 'Continue';
        }, 1400);
      });

      fetch('./world.json')
        .then((response) => {
          if (!response.ok) throw new Error('map data unavailable');
          return response.json();
        })
        .then(buildMap)
        .catch(() => {
          statusEl.textContent = 'Map data unavailable.';
        });
    </script>
  </body>
</html>
